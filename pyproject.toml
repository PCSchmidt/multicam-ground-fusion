[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multicam-ground-fusion"
version = "0.1.0"
description = "Multi-camera ground-plane tracking: homography projection, Kalman fusion, Mahalanobis-gated Hungarian association, physical-plausibility drift flags."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PCSchmidt" }]
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/multicam_fusion"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
